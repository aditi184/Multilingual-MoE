run_name: retrain-olmoe-5lang-lrl
seed: 6198
dry_run: false
no_pre_train_checkpoint: false

wandb:
  project: "Retrain-OLMoE-5lang-LRL"   # Name of your W&B project
  entity: "aditi-khandelwal-mcgill-university"  # W&B entity (usually your username or team name)
  group: "aditi-khandelwal-mcgill-university"      # (Optional) Group name for multiple runs
  name: "retrain-olmoe-5lang-lrl"               # (Optional) Custom name for this run
  tags: ["experiment1"]  # (Optional) Tags for filtering runs
  rank_zero_only: true 

model:
  d_model: 2048
  n_heads: 16
  n_kv_heads: null
  clip_qkv: null
  n_layers: 16
  mlp_ratio: 1
  weight_tying: false
  alibi: false
  alibi_bias_max: 8.0
  rope: true
  rope_full_precision: true
  flash_attention: true
  attention_dropout: 0.0
  attention_layer_norm: false
  include_bias: false
  block_type: moe
  block_group_size: 1
  layer_norm_type: rms
  layer_norm_with_affine: true
  bias_for_layer_norm: false
  attention_layer_norm_with_affine: false
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 4096
  vocab_size: 50280
  embedding_size: 50304
  eos_token_id: 0
  pad_token_id: 1
  init_device: meta
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3
  moe_top_k: 8
  moe_num_experts: 64
  moe_dropless: true
  moe_mlp_impl: sparse
  moe_zloss_weight: 0.001
  moe_loss_weight: 0.01
  multi_query_attention: null
  precision: amp_bf16


compile: null

optimizer:
  name: adamw
  learning_rate: 4.0e-4
  eps: 1.0e-8
  weight_decay: 0.1
  decay_norm_and_bias: true
  decay_embeddings: true
  betas:
  - 0.9
  - 0.95
  metrics_log_interval: 25

scheduler:
  name: cosine_with_warmup
  units: tokens
  t_warmup: 10485760000
  t_max: 5e12
  alpha_f: 0.1

tokenizer:
  identifier: tokenizers/allenai_gpt-neox-olmo-dolma-v1_5.json
  truncate_direction: right

save_folder: /home/mila/k/khandela/scratch/ai2-llm/runs/${run_name}
remote_save_folder: null
save_overwrite: true

save_interval: 100
save_interval_ephemeral: null
save_num_checkpoints_to_keep: 2
sharded_checkpointer: olmo_core

save_interval_unsharded: 100
save_num_unsharded_checkpoints_to_keep: 2

load_path: /home/mila/k/khandela/scratch/ai2-llm/runs/retrain-olmoe-5lang-lrl/latest
eval_on_load: false

max_duration: 5ep
global_train_batch_size: 1024
device_train_microbatch_size: 2

precision: amp_bf16
distributed_strategy: fsdp

fsdp:
  wrapping_strategy: by_block
  precision: mixed
  sharding_strategy: FULL_SHARD

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 1

eval_interval: 100
eval_subset_num_batches: -1
device_eval_batch_size: ${device_train_microbatch_size}
evaluators:
  - label: validation-test
    data:
      num_workers: 0
      drop_last: true
      datasets:
        arabic-validation:
          - /home/mila/k/khandela/scratch/olmoe-data/test/ar/part-0-00000.npy
        russian-validation:
          - /home/mila/k/khandela/scratch/olmoe-data/test/ru/part-0-00000.npy
        chinese-validation:
          - /home/mila/k/khandela/scratch/olmoe-data/test/zh/part-0-00000.npy
        hindi-validation:
          - /home/mila/k/khandela/scratch/olmoe-data/test/hi/part-0-00000.npy
        english-validation:
          - /home/mila/k/khandela/scratch/olmoe-data/test/en/part-0-00000.npy
        farsi-validation:
          - /home/mila/k/khandela/scratch/olmoe-data/test/fa/part-0-00000.npy
        ukrainian-validation:
          - /home/mila/k/khandela/scratch/olmoe-data/test/uk/part-0-00000.npy
        japanese-validation:
          - /home/mila/k/khandela/scratch/olmoe-data/test/ja/part-0-00000.npy
        nepali-validation:
          - /home/mila/k/khandela/scratch/olmoe-data/test/ne/part-0-00000.npy

data:
  pad_direction: right
  num_workers: 32
  drop_last: true
  pin_memory: true
  prefetch_factor: 8
  persistent_workers: true
  timeout: 0
  instance_filter:
      repetition_max_period: 13
      repetition_min_period: 1
      repetition_max_count: 32  
  paths:
    - /home/mila/k/khandela/scratch/olmoe-data/multilang_lrl_train/part-00-00000.npy
    - /home/mila/k/khandela/scratch/olmoe-data/multilang_lrl_train/part-01-00000.npy
